api: 1
id: standard
description: 仓颉链（字母码，最多五码）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-cangjie-parse, after: pime-keymap-default, role: parse }
  - { id: pime-cangjie-translate, after: pime-cangjie-parse, role: translate }
  - { id: pime-rank-default, after: pime-cangjie-translate, role: rank }
  - { id: pime-candidates-format, after: pime-rank-default, role: format }
  - { id: pime-learn-frequency, after: pime-candidates-format, role: learn }

workspace:
  - { key: plugin/pime-keymap-default/action,
      from: pime-keymap-default, to: [pime-cangjie-parse] }
  - { key: plugin/pime-cangjie-parse/code,
      from: pime-cangjie-parse,
      to: [pime-cangjie-translate, pime-candidates-format] }
  - { key: plugin/pime-cangjie-translate/candidates,
      from: pime-cangjie-translate,
      to: [pime-rank-default, pime-candidates-format] }
  - { key: plugin/pime-rank-default/candidates,
      from: pime-rank-default, to: [pime-candidates-format] }
  - { key: plugin/pime-candidates-format/committed,
      from: pime-candidates-format, to: [pime-learn-frequency] }
