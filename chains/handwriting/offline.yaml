api: 1
id: offline
description: 离线手写链
core: ">=1.0.0"

plugins:
  - { id: pime-handwriting-ncnn, role: recognize }
  - { id: pime-candidates-format, after: pime-handwriting-ncnn, role: format }
  - { id: pime-learn-frequency, after: pime-candidates-format, role: learn }
  - { id: pime-user-dict, after: pime-learn-frequency, role: service }

workspace:
  - { key: plugin/pime-handwriting-ncnn/candidates,
      from: pime-handwriting-ncnn, to: [pime-candidates-format] }
  - { key: plugin/pime-candidates-format/committed,
      from: pime-candidates-format,
      to: [pime-learn-frequency, pime-user-dict] }
