api: 1
id: shuangpin
description: 双拼链（两键成音节）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-shuangpin-standard, role: preprocess }
  - { id: pime-pinyin-parse, role: parse }
  - { id: pime-shape-parse, role: parse }
  - { id: pime-pinyin-translate, role: translate }
  - { id: pime-pinyin-rank, role: rank }
  - { id: pime-special-candidates, role: translate }
  - { id: pime-shortcuts, role: translate }
  - { id: pime-hans-hant, role: translate }
  - { id: pime-shape-translate, role: translate }
  - { id: pime-emoji-suggest, role: predict }
  - { id: pime-clip-code, role: predict }
  - { id: pime-candidates-format, role: format }
  - { id: pime-learn-user-dict, role: learn }
  - { id: pime-predict-context, role: predict }
  - { id: pime-app-mode, role: learn }
  - { id: pime-learn-frequency, role: learn }

workspace:
  - { key: plugin/pime-keymap-default/action,
      from: pime-keymap-default,
      to: [pime-shuangpin-standard, pime-pinyin-parse] }
  - { key: plugin/pime-shuangpin-standard/consumed,
      from: pime-shuangpin-standard, to: [pime-pinyin-parse] }
  - { key: plugin/pime-shuangpin-standard/syllable,
      from: pime-shuangpin-standard, to: [pime-pinyin-parse] }
  - { key: plugin/pime-pinyin-parse/raw,
      from: pime-pinyin-parse,
      to: [pime-pinyin-translate, pime-special-candidates, pime-shortcuts,
            pime-candidates-format] }
  - { key: plugin/pime-pinyin-parse/syllables,
      from: pime-pinyin-parse, to: [pime-pinyin-translate] }
  - { key: plugin/pime-pinyin-translate/candidates,
      from: pime-pinyin-translate, to: [pime-pinyin-rank] }
  - { key: plugin/pime-pinyin-rank/candidates,
      from: pime-pinyin-rank,
      to: [pime-special-candidates, pime-shortcuts, pime-hans-hant,
            pime-shape-translate, pime-candidates-format] }
  - { key: plugin/pime-special-candidates/candidates,
      from: pime-special-candidates,
      to: [pime-shortcuts, pime-hans-hant, pime-shape-translate,
            pime-candidates-format] }
  - { key: plugin/pime-shortcuts/candidates,
      from: pime-shortcuts,
      to: [pime-hans-hant, pime-shape-translate, pime-candidates-format] }
  - { key: plugin/pime-hans-hant/candidates,
      from: pime-hans-hant,
      to: [pime-shape-translate, pime-candidates-format] }
  - { key: plugin/pime-emoji-suggest/candidates,
      from: pime-emoji-suggest, to: [pime-candidates-format] }
  - { key: plugin/pime-clip-code/candidates,
      from: pime-clip-code, to: [pime-candidates-format] }
  - { key: plugin/pime-shape-parse/mode,
      from: pime-shape-parse, to: [pime-shape-translate] }
  - { key: plugin/pime-shape-parse/code,
      from: pime-shape-parse, to: [pime-shape-translate] }
  - { key: plugin/pime-shape-translate/candidates,
      from: pime-shape-translate, to: [pime-candidates-format] }
  - { key: plugin/pime-candidates-format/committed,
      from: pime-candidates-format,
      to: [pime-learn-user-dict, pime-learn-frequency] }
  - { key: plugin/pime-learn-user-dict/next,
      from: pime-learn-user-dict, to: [pime-predict-context] }
  - { key: plugin/pime-learn-user-dict/last,
      from: pime-learn-user-dict, to: [pime-predict-context] }
