api: 1
id: fourteen
description: 14 键链（a–n，每键两个字母）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-t9-parse, after: pime-keymap-default, role: parse, settings: { grouping: fourteen } }
  - { id: pime-t9-translate, after: pime-t9-parse, role: translate, settings: { grouping: fourteen } }
  - { id: pime-candidates-format, after: pime-t9-translate, role: format }
  - { id: pime-learn-frequency, after: pime-candidates-format, role: learn }

workspace:
  - { key: plugin/pime-keymap-default/action,
      from: pime-keymap-default, to: [pime-t9-parse] }
  - { key: plugin/pime-t9-parse/raw,
      from: pime-t9-parse, to: [pime-t9-translate, pime-candidates-format] }
  - { key: plugin/pime-t9-translate/candidates,
      from: pime-t9-translate, to: [pime-candidates-format] }
  - { key: plugin/pime-candidates-format/committed,
      from: pime-candidates-format, to: [pime-learn-frequency] }
