description: 模板：复制到 plugins/<role>/<id> 后改成真实插件
id: pime-example
version: 0.1.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: parse
# 默认直接前驱（一个插件 id）：包管理器导入本插件时插到它后面。
# 省略则由包管理器按 role 兜底；必须是链头时写 after: null。
# after: pime-keymap-default
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [input.read, workspace]
requires: []
limits:
  memory_mb: 8
  instructions: 1000000
  time_ms: 5
  state_kb: 32
  workspace_kb: 64
  candidates_max: 8
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 50, async_ms: 20 }
settings:
  - { key: enabled, type: bool, default: true }
