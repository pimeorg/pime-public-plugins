name: comments-and-labels
event: { type: text, text: ni }
workspace:
  plugin/pime-pinyin-parse/raw: ni
  plugin/pime-pinyin-rank/candidates:
    - { text: 你, score: 18000, comment: 常用 }
    - { text: 呢, score: 5500, pinyin: ne }
# comment 作为注释；没有 comment 时回退 pinyin；label 是本页选择键。
expect:
  handled: true
  commands:
    - type: show_candidates
      items:
        - { text: 你, comment: 常用, label: "1" }
        - { text: 呢, comment: ne, label: "2" }
