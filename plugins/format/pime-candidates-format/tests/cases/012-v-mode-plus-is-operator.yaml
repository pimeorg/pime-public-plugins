name: v-mode-plus-is-operator-not-paging
settings: { page_size: 2 }
event: { type: key, keycode: 187 }
workspace:
  plugin/pime-keymap-default/action: pagedown
  plugin/pime-pinyin-parse/raw: v1+2
  plugin/pime-special-candidates/candidates:
    - { text: "3", score: 9000 }
    - { text: "叁", score: 8000 }
    - { text: "三", score: 7000 }
expect:
  handled: true
  commands:
    - { type: show_candidates, items: [{ text: "3" }, { text: "叁" }] }
# 组合是 v 模式表达式时，'+'（keymap 的 pagedown）是运算符，不翻页。
