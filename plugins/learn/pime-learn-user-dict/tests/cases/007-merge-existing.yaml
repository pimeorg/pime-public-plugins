name: merge-existing
steps:
  - event: { type: text, text: nihao }
    workspace:
      plugin/pime-pinyin-parse/raw: nihao
      plugin/pime-candidates-format/committed: 你好
  - event: { type: text, text: nihao }
    workspace:
      plugin/pime-pinyin-parse/raw: nihao
      plugin/pime-pinyin-rank/candidates:
        - { text: 你, score: 900, source: dict }
        - { text: 你好, score: 800, source: dict }
    expect:
      handled: false
      workspace:
        - k: candidates
          v:
            - { text: 你好, source: user }
            - { text: 你, source: dict }
