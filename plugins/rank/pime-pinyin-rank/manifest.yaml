description: 拼音候选重排：短词加权后按分数降序
id: pime-pinyin-rank
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: rank
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, ios-arm64, harmony-arm64]
entry: pime_process
capabilities: [workspace]
requires: [pime-pinyin-translate@^1.0]
limits:
  memory_mb: 16
  instructions: 4000000
  time_ms: 5
  state_kb: 32
  workspace_kb: 128
  candidates_max: 32
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 50, async_ms: 20 }
settings:
  - { key: short_boost, type: int, default: 100, min: 0, max: 100000 }
  - { key: max_candidates, type: int, default: 16, min: 1, max: 32 }
