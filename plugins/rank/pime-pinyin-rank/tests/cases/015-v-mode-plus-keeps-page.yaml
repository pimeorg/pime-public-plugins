name: v-mode-plus-does-not-move-page
settings: { page_size: 2 }
steps:
  - event: { type: key, keycode: 34 }
    workspace:
      plugin/pime-keymap-default/action: pagedown
      plugin/pime-pinyin-parse/raw: ni
      plugin/pime-pinyin-translate/candidates:
        - { text: 你, score: 500000, source: dict, words: 1 }
        - { text: 泥, score: 495000, source: dict, words: 1 }
        - { text: 逆, score: 490000, source: dict, words: 1 }
    expect:
      state: { page: 1 }
  - event: { type: key, keycode: 187 }
    workspace:
      plugin/pime-keymap-default/action: pagedown
      plugin/pime-pinyin-parse/raw: v1+2
      plugin/pime-pinyin-translate/candidates:
        - { text: 你, score: 500000, source: dict, words: 1 }
        - { text: 泥, score: 495000, source: dict, words: 1 }
        - { text: 逆, score: 490000, source: dict, words: 1 }
  - event: { type: key, keycode: 32 }
    workspace:
      plugin/pime-keymap-default/action: space
      plugin/pime-pinyin-parse/raw: v1+2
      plugin/pime-pinyin-translate/candidates:
        - { text: 你, score: 500000, source: dict, words: 1 }
        - { text: 泥, score: 495000, source: dict, words: 1 }
        - { text: 逆, score: 490000, source: dict, words: 1 }
    expect:
      state: { last_text: 你 }
# v 模式里的 '+' 不翻页，空格仍按第 0 页选词。
