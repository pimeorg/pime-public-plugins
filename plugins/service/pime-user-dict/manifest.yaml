description: 服务：用户词库记录、查询与删除
id: pime-user-dict
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: lua
role: service
after: [preprocess, parse, translate, rank, format, recognize, learn, predict, service]
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: plugin.lua
capabilities: [store.kv, workspace]
requires: []
limits:
  memory_mb: 8
  instructions: 200000
  time_ms: 5
  state_kb: 8
  workspace_kb: 32
  store_mb: 8
  candidates_max: 32
  max_frame_bytes: 65536
budget: { sync_us: 60, async_ms: 20 }
settings:
  - { key: enabled, type: bool, default: true }
  - { key: max_words, type: int, default: 32, min: 1, max: 128 }
