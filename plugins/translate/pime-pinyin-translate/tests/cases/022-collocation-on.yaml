name: collocation-ranks-natural-tail
event: { type: text, text: nihaoma }
workspace:
  plugin/pime-pinyin-parse/raw: nihaoma
# 字符搭配模型默认开启：整词“你好吗”之后的“你好嘛”靠搭配分进入前三，
# 排在纯词频决定的“年好吗”之前。
expect:
  handled: true
  workspace:
    - k: candidates
      v:
        - { text: 你好吗, source: dict }
        - { text: 你好吗啊, source: sentence }
        - { text: 你好嘛, source: compose }
