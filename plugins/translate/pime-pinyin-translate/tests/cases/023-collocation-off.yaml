name: collocation-disabled-falls-back-to-unigram
settings: { collocation_weight: 0 }
event: { type: text, text: nihaoma }
workspace:
  plugin/pime-pinyin-parse/raw: nihaoma
# 关闭搭配模型后，第三候选回到纯词频决定的“年好吗”。
expect:
  handled: true
  workspace:
    - k: candidates
      v:
        - { text: 你好吗, source: dict }
        - { text: 你好吗啊, source: sentence }
        - { text: 年好吗, source: compose }
