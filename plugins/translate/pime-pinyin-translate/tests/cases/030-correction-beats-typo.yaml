# 扩展词表里有「你还好」(nǐ hái hǎo)，它能覆盖 nihhao 的字面缩写；
# 但它只是低频词，不享受"整词保护"，删掉一个 h 的纠正读法「你好」仍胜出。
name: rare-literal-word-does-not-veto-correction
event: { type: text, text: nihhao }
workspace:
  plugin/pime-pinyin-parse/raw: nihhao
  plugin/pime-pinyin-parse/corrected: nihao
expect:
  handled: true
  workspace:
    - k: candidates
      v:
        - { text: 你好, source: corrected }
