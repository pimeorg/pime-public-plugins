# 桌面方案包「cangjie」的链配方。由 tools/pack_schemes.py 编译成
# dist/schemes/cangjie/cangjie.cbor，和 scheme.yaml 里的插件副本一起组装成方案包。

api: 1
id: cangjie
description: 仓颉（桌面）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-cangjie-parse, after: pime-keymap-default, role: parse }
  - { id: pime-cangjie-translate, after: pime-cangjie-parse, role: translate,
      settings: { max_candidates: 32 } }
  - { id: pime-rank-default, after: pime-cangjie-translate, role: rank,
      settings: { max_candidates: 32 } }
  - { id: pime-candidates-format, after: pime-rank-default, role: format, settings: { page_size: 6 } }
